# Backing services only. The Rails server, Sidekiq, and the Next.js dev server
# all run natively on the host — see quickstart.md.
#
# Postgres and Redis are containerised because they are stateful things nobody
# wants to install and version per machine. The application is not, because
# containerising it buys nothing here and costs a rebuild on every gem change,
# an extra hop for the debugger, and a bind-mount whose Gemfile.lock drifts from
# the gems baked into the image. CI already runs the suite natively against
# service containers (.github/workflows/ci.yml); this makes local development
# match it rather than diverge from it.
#
# The project name is pinned so the volume keeps its identity — compose derives
# it from the directory otherwise, and moving this file would have orphaned the
# existing database.
name: shortener

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Non-default host ports: 5432 and 6379 are commonly already taken by a
    # system-wide install, and the whole point of this file is that it does not
    # fight whatever else the machine is running.
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    # A bounded cache that evicts rather than OOMs.
    #
    # `maxmemory` and `maxmemory-policy` are per *server*, not per database, so
    # `allkeys-lru` is entitled to every key on this instance: the link cache and
    # the click buffer in db0, and Sidekiq's queues in db1. The db split
    # (config/initializers/sidekiq.rb) separates naming and FLUSHDB, not
    # eviction — isolating the queue from LRU would take a second instance.
    #
    # Accepted for the reference environment, where 512mb is far above the
    # working set: 10 000 cached links measure ~2.5mb, and one entry costs ~250
    # bytes with overhead, so the budget holds roughly two million of them.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports: ["${REDIS_HOST_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Dashboards ------------------------------------------------------------
  # Read-only-ish debugging surfaces for the two stateful services. They are
  # ordinary compose services rather than host installs for the same reason
  # Postgres and Redis are: nobody wants to version a database client per
  # machine.
  #
  # Both dial their backend over the compose network — `postgres:5432` and
  # `redis:6379`, the container ports — not the published host ports. The
  # non-default 5433/6380 above exist only so the natively-run Rails process
  # does not collide with a system-wide install, and they are irrelevant in
  # here.

  adminer:
    image: adminer:5
    environment:
      # The only prefill this image offers: its index.php reads
      # ADMINER_DEFAULT_SERVER and nothing else, so the driver still defaults to
      # MySQL and picking Postgres by hand is a connection refused waiting to
      # happen. Open the deep link in quickstart.md instead — Adminer takes the
      # driver, the server, the user and the database from the query string.
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["${ADMINER_PORT}:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:2.70
    environment:
      # Seeds the connection list with db0 — the link cache and click buffer.
      # It appears once the first-run agreement is accepted, not before: the
      # seeding runs behind that screen. Sidekiq's db1 is the same server,
      # reachable from the database selector in the browser; RedisInsight has
      # no environment variable for a second database index.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: shortener
    ports: ["${REDISINSIGHT_PORT}:5540"]
    # Named volume so the connection, and anything configured in the UI,
    # survives `docker compose down`. It holds no application state — deleting
    # it costs one re-seeded connection.
    volumes: ["redisinsight:/data"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisinsight:
