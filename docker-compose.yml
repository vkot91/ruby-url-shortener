# Reference environment for the load test (research.md D13): one host, all
# services co-resident, so the naive and cached runs differ only in the code.
name: shortener

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  RAILS_MAX_THREADS: "5"
  # db0 is the read cache and click buffer; db1 is the Sidekiq broker. Splitting
  # them keeps `allkeys-lru` from evicting queued jobs (D9, Principle IV).
  REDIS_URL: redis://redis:6379/0
  SIDEKIQ_REDIS_URL: redis://redis:6379/1
  SHORT_DOMAIN: ${SHORT_DOMAIN}
  APP_URL: ${APP_URL}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    # Non-default host ports: these are published so host-side rspec and k6 can
    # reach them, and 5432/6379 are commonly already taken. Container-internal
    # ports are unchanged, so service-to-service URLs stay standard.
    ports: ["${POSTGRES_HOST_PORT}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    # A bounded cache that evicts rather than OOMs. The click buffer lives in
    # db1 alongside Sidekiq, which allkeys-lru would also evict — accepted for
    # the reference environment, where 512mb is far above the working set.
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports: ["${REDIS_HOST_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # db:prepare on boot means a fresh clone needs only `docker compose up`.
    # The pid file is removed first: tmp/ is bind-mounted, so a container killed
    # without a clean shutdown leaves one behind and Puma then refuses to boot.
    #
    # `bundle check || bundle install` is what keeps the bind-mounted source and
    # the baked-in gems from drifting apart. /rails is mounted from the host, so
    # a Gemfile.lock edited outside the container — a `bundle install` run on the
    # host for editor tooling, a gem added on a branch — is visible instantly
    # while the gems it names are not, and bundler aborts with GemNotFound. The
    # check is a no-op when they already agree.
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             (bundle check || bundle install) &&
             ./bin/rails db:prepare &&
             ./bin/rails server -b 0.0.0.0 -p 3001"
    environment: *backend-env
    volumes: ["./backend:/rails", "bundle:/bundle"]
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  sidekiq:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "(bundle check || bundle install) &&
             bundle exec sidekiq -C config/sidekiq.yml"
    environment: *backend-env
    volumes: ["./backend:/rails", "bundle:/bundle"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: pnpm dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  # Installed gems, shared by backend and sidekiq. Seeded from the image layer on
  # first `up` and written to by the boot-time `bundle install`, so a gem change
  # survives a restart and costs a rebuild only when the base image itself moves.
  bundle:
