openapi: 3.1.0
info:
  title: URL Shortener API
  version: 1.0.0-mvp
  description: |
    JSON API on the app domain, consumed by the Next.js dashboard and admin area.
    The public redirect surface is a separate contract; see contracts/redirect.md.
    Authentication is an access token: HS256, 15-minute lifetime, verified by signature alone.
    It arrives either as `Authorization: Bearer <jwt>`, which is what a mobile app or a CLI
    sends, or as the `snip_access` cookie, which is what a browser sends — one credential read
    from whichever place the client had (research.md D10a). Refresh is an opaque rotating token
    the browser never sees.

    This API reads cookies and sets none, on any path. Both session cookies are written by the
    Next.js BFF; `ActionDispatch::Cookies` is deliberately absent from the middleware stack, so
    the redirect surface's `no Set-Cookie` guarantee is structural rather than a convention
    (FR-015).

servers:
  - url: https://app.example.com/api/v1

tags:
  - name: auth
  - name: links
  - name: admin

paths:
  /registrations:
    post:
      tags: [auth]
      summary: Register an account (FR-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        '201':
          description: Created. Returns a token pair; no cookie is set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many attempts from this origin in the last hour (FR-036).

  /sessions:
    post:
      tags: [auth]
      summary: Sign in (FR-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '201':
          description: Signed in. Opens a new refresh-token family.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { description: Invalid credentials }
        '429':
          description: |
            Too many attempts in the last hour, from this origin or against this email
            address (FR-036). The body is identical to the 401 body — it must not reveal
            whether the address is registered.
    delete:
      tags: [auth]
      summary: Sign out
      description: |
        Revokes the caller's refresh-token family. The current access token is not revoked and
        remains valid until it expires — see research.md D10's recorded window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Refresh-token family revoked }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new pair (research.md D10)
      security: []
      description: |
        Rotation is mandatory: the presented token is consumed and a successor is issued in the
        same family. Presenting a token that was exchanged more than ten seconds ago is treated
        as a compromise — the entire family is revoked and the caller must sign in again.

        Inside those ten seconds a replay is read as the same client retrying (two tabs expiring
        together, a lost response) and answered with `201` and a second successor in the same
        family, not with the first one again (research.md D10a).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '201':
          description: |
            A new pair. The presented token is now spent: replaying it succeeds once more
            within the ten-second grace window and revokes the family after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: |
            `error.code` is `invalid_refresh_token` when the token is unknown, expired, or
            revoked, and `token_reuse_detected` when an already-exchanged token was replayed
            after the grace window. The second case has also just revoked the whole family.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many attempts from this origin in the last hour (FR-036).

  /me:
    get:
      tags: [auth]
      summary: The signed-in account (FR-001)
      description: |
        Who the caller is, read from the row rather than from the token. The dashboard needs an
        address for its header and a role to decide whether to draw the admin link; this is the
        only place either is published.

        `role` here is display, not authority. Authorisation reads the role claim in the signed
        access token, which is refreshed at most every fifteen minutes, so the two are allowed
        to disagree for that long — a client that granted itself the admin area from this field
        would reach endpoints that answer 403.
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: '#/components/schemas/Account' }
        '401':
          description: |
            `error.code` is `token_expired` when a token arrived and has aged out, and
            `unauthenticated` when none arrived or it did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /links:
    get:
      tags: [links]
      summary: List the caller's links (FR-002, FR-023)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
          description: >-
            Clamped, not validated: a value above 100 returns 100, and anything that is not a
            positive integer returns the default. `pagination.per_page` reports what was applied.
      responses:
        '200':
          description: >-
            Only links owned by the caller, never another account's. Newest first; soft-deleted
            links are absent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/Link' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [links]
      summary: Create a link (FR-005 through FR-012)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination_url]
              properties:
                destination_url: { type: string, format: uri }
                name: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '422':
          description: |
            Rejected. error.code distinguishes the reason so the UI can explain it:
            invalid_url, unsupported_scheme, private_address, self_referential,
            blocked_domain, link_limit_reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Hourly creation limit exceeded (FR-004). Existing redirects are unaffected.

  /links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [links]
      summary: Fetch one link
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '404':
          description: Not found, or owned by another account - indistinguishable by design (FR-002)
    patch:
      tags: [links]
      summary: Edit destination or name (FR-025, FR-026, FR-027)
      description: |
        code is absent from the request schema deliberately - it cannot be changed (FR-026).
        Sending it yields 422 rather than being silently ignored.
        The cache entry is invalidated before this response returns (Principle IV).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destination_url: { type: string, format: uri }
                name: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Not found or not owned }
    delete:
      tags: [links]
      summary: Soft-delete (FR-028, FR-029)
      responses:
        '204': { description: Statistics retained; code not released; cache invalidated }
        '404': { description: Not found or not owned }

  /admin/links:
    get:
      tags: [admin]
      summary: Search any link by code or destination (FR-030)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/AdminLink' }
        '403': { description: Caller is not an administrator (FR-003) }

  /admin/links/{id}/ban:
    post:
      tags: [admin]
      summary: Ban a link (FR-031)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cache invalidated; next visitor sees the warning page }
        '403': { description: Not an administrator }

  /admin/accounts/{id}/ban:
    post:
      tags: [admin]
      summary: Ban an account and all its links (FR-031)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Every cached link of the account is invalidated }
        '403': { description: Not an administrator }

  /admin/reports:
    get:
      tags: [admin]
      summary: Moderation queue (FR-033)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, actioned, dismissed], default: pending }
      responses:
        '200': { description: Reports, oldest first }
        '403': { description: Not an administrator }

  /admin/blocked_domains:
    get:
      tags: [admin]
      summary: List the blocklist (FR-032)
      responses:
        '200': { description: Current blocklist }
        '403': { description: Not an administrator }
    post:
      tags: [admin]
      summary: Add a blocked domain (FR-032)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                reason: { type: string }
      responses:
        '201': { description: Added. Existing links are not retroactively banned. }
        '403': { description: Not an administrator }

  /admin/health:
    get:
      tags: [admin]
      summary: Operational metrics (FR-035)
      description: |
        Deliberately contains no customer marketing analytics. Principle V keeps those
        behind an audited support mode, which is out of MVP scope.
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  cache_hit_ratio:
                    type: number
                    description: proportion over the last hour; the headline metric
                  redirect_p50_ms: { type: number }
                  redirect_p99_ms: { type: number }
                  redirects_per_second: { type: number }
                  click_buffer_depth: { type: integer }
                  click_flush_lag_seconds: { type: number }
                  redis_memory_used_bytes: { type: integer }
        '403': { description: Not an administrator }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token, sent by non-browser clients. A 401 with `error.code` of
        `token_expired` means refresh and retry; `unauthenticated` means none arrived or it did
        not verify. Takes priority over the cookie when both are present.
    cookieAuth:
      type: apiKey
      in: cookie
      name: snip_access
      description: |
        The same access token, as the browser sends it: an httpOnly cookie written by the
        Next.js BFF and attached by `credentials: include`. Not a second credential — the
        signature check, claims, expiry, and error codes are identical (research.md D10a).
        The browser client treats every 401 alike: refresh once through the BFF, retry once,
        and sign out if the refresh is refused (D10b).

  schemas:
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
          description: |
            JWT. A non-browser client sends it as `Authorization: Bearer` and holds it in
            memory. A browser never receives it: the BFF puts it in an httpOnly cookie, because
            a value held in JavaScript dies with the page and made every reload spend a refresh
            token to mint another (research.md D10a).
        refresh_token:
          type: string
          description: |
            Opaque, single-use. Browser clients never see this — the Next.js BFF stores it in an
            httpOnly cookie on its own origin.
        expires_in:
          type: integer
          description: Access-token lifetime in seconds (900).

    Account:
      type: object
      required: [id, email, role, plan, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [creator, admin]
          description: Display only. Authorisation reads the role claim in the access token.
        plan: { type: string, enum: [free] }
        created_at: { type: string, format: date-time }
      description: >-
        `banned_at` is deliberately absent: it is an administrative fact about an account, and a
        banned account cannot reach this endpoint anyway — the ban revokes its refresh tokens.

    Link:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: immutable (FR-026) }
        short_url: { type: string, format: uri }
        destination_url: { type: string, format: uri }
        name: { type: string, nullable: true }
        clicks_count:
          type: integer
          description: Up to 30 seconds behind reality (SC-009) - batch-flushed, not live.
        created_at: { type: string, format: date-time }

    AdminLink:
      allOf:
        - $ref: '#/components/schemas/Link'
        - type: object
          properties:
            account_id: { type: string, format: uuid }
            banned_at: { type: string, format: date-time, nullable: true }
            deleted_at: { type: string, format: date-time, nullable: true }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []
  - cookieAuth: []
